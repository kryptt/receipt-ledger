[package]
name = "receipt-ledger"
version = "0.17.0"
edition = "2024"
license = "MIT"
description = "Transaction-notification-email → Firefly III ingestor (one-shot CronJob)"
# This is an APPLICATION (a one-shot CronJob binary), not a library. Its `pub` API
# surface exists only so the integration tests in `tests/` can drive the pipeline;
# it is NOT a SemVer contract. Mark it unpublishable so a changed signature (e.g.
# `run(http: Client)`) can never be an accidental crates.io publish / breaking release.
publish = false

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OAuth2 token request bodies (application/x-www-form-urlencoded). reqwest is
# built without its `urlencoded` feature, so we encode the form ourselves; this
# crate is already in the tree transitively via reqwest.
serde_urlencoded = "0.7"
rust_decimal = { version = "1", features = ["serde-with-str"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
sha2 = "0.10"

# reqwest 0.13 is pinned by jmap-client; reuse the same major here so the
# dependency tree carries a single reqwest. rustls-no-provider keeps us off
# reqwest's default rustls feature gymnastics; we install the ring crypto
# provider ourselves in main(). aws-lc-rs is still pulled transitively by
# jmap-client's `reqwest/rustls` feature, hence the cmake/clang build deps
# in the Dockerfile builder stage.
reqwest = { version = "0.13", default-features = false, features = ["http2", "json", "charset", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# stalwartlabs JMAP + MIME parsing. Drop default features to avoid the
# websockets/tokio-tungstenite stack we never use; `async` + `ring` give us
# the reqwest-backed async client on a pure-Rust TLS path.
jmap-client = { version = "0.4", default-features = false, features = ["async", "ring"] }
mail-parser = "0.11"

# Pure-Rust PDF decryption + content-stream parsing for Banco Popular monthly
# statements (RC4/Standard-encrypted). Chosen over lopdf, which fails to load
# these real-world statements (its xref parser populates only 1 object); `pdf`
# opens + decrypts them cleanly. We track the CTM + text matrix across the page
# operations to recover positioned text and reassemble the statement columns.
pdf = "0.9"
# Fuzzy merchant-name similarity for reconciling statement rows against charges
# already booked from consumo notifications: foreign-charge amounts never match
# exactly (ECB estimate vs billed), so merchant similarity is a key signal.
strsim = "0.11"

# OTLP trace export to Tempo (Phase-2 observability), OFF unless
# OTEL_EXPORTER_OTLP_ENDPOINT is set — see src/telemetry.rs. We deliberately take
# the OTLP-over-HTTP path with the JSON wire format (`http-json`, NOT `grpc-tonic`):
# no tonic/hyper-grpc stack. The default `BatchSpanProcessor` runs on a dedicated
# thread with no tokio reactor, so it is paired with the BLOCKING reqwest client
# (`reqwest-blocking-client`); the async `reqwest-client` panics "no reactor" on
# that thread. The blocking client reuses the same reqwest/rustls(+ring) crates
# already in the tree, so the only genuinely new crates are pure-Rust
# (opentelemetry*, prost, const-hex). The musl/Dockerfile builder is unaffected
# (no new C toolchain). Versions are a mutually-compatible set:
# opentelemetry/otlp/sdk 0.32, tracing-opentelemetry 0.33.
#
# `internal-logs` is REQUIRED, not optional polish. Without it the SDK's
# `otel_error!`/`otel_warn!` macros compile to `let _ = ...` no-ops (see
# `opentelemetry/src/global/internal_logging.rs`), so a rejected export — a 404,
# a refused connection, a partial-success rejection — is discarded in total
# silence. That violates the crate's no-silently-swallowed-errors rule and hid a
# live 404 against Tempo for the whole life of 0.16.0. With it on, those surface
# as `tracing` events on the `opentelemetry*` targets through the normal fmt
# layer (they are events, not spans, so there is no feedback loop through the
# OpenTelemetry span layer).
opentelemetry = { version = "0.32", default-features = false, features = ["trace", "internal-logs"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "internal-logs"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "http-json", "reqwest-blocking-client", "internal-logs"] }
tracing-opentelemetry = { version = "0.33", default-features = false }

[dev-dependencies]
# Property-based testing for the pure deterministic core (amount parsing, FX
# rounding reconciliation, dedup invariants, balanced-span round-trip).
proptest = "1"
# `testing` enables the in-memory span exporter the telemetry tests use to give
# spans real (non-zero) trace_ids without a live collector. Dev-only — feature
# unification adds it to the same opentelemetry_sdk build, not to the binary's
# runtime path (the in-memory exporter is never constructed outside #[cfg(test)]).
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "testing"] }

[profile.release]
lto = true
strip = true
opt-level = "z"
